<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased relative overflow-x-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin h-20 bg-surface/80 backdrop-blur-md border-b border-border-subtle">
<div class="flex items-center gap-base">
<span class="material-symbols-outlined text-primary cursor-pointer">menu</span>
<div class="font-headline-md text-headline-md font-bold uppercase text-primary tracking-tight">Campus Org</div>
</div>
<div class="font-label-caps text-label-caps text-on-surface-variant">LOGIN</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-32 pb-xl px-margin flex items-center justify-center relative z-10">
<div class="w-full max-w-md relative">
<!-- Login Form Container -->
<div class="bg-surface-container-lowest border border-border-subtle rounded-xl shadow-sm p-md flex flex-col transition-all duration-300" id="login-container">
<div class="pb-md mb-md text-center">
<h2 class="font-headline-lg text-headline-lg text-on-background mb-xs">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your credentials to manage organization resources.</p>
</div>
<form class="flex flex-col gap-sm flex-grow">
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps uppercase text-on-surface-variant" for="username">Identifier</label>
<input class="bg-surface border border-outline-variant rounded-lg p-sm font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" id="username" placeholder="Student ID or Email" type="text">
</div>
<div class="flex flex-col gap-xs relative">
<label class="font-label-caps text-label-caps uppercase text-on-surface-variant" for="password">Passcode</label>
<input class="bg-surface border border-outline-variant rounded-lg p-sm font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors pr-12" id="password" placeholder="••••••••" type="password">
<button class="absolute right-3 bottom-3 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<div class="flex justify-between items-center mt-xs">
<label class="flex items-center gap-xs cursor-pointer group">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary bg-surface transition-colors" type="checkbox">
<span class="font-body-md text-sm text-on-surface-variant group-hover:text-on-background transition-colors">Remember me</span>
</label>
<button class="font-body-md text-sm text-on-surface-variant hover:text-primary transition-colors" onclick="toggleFlow()" type="button">Forgot Passcode?</button>
</div>
<button class="mt-md w-full bg-primary text-on-primary rounded-lg py-sm font-label-caps text-label-caps uppercase hover:bg-primary/90 transition-colors flex justify-center items-center gap-sm group" type="button">
                        Sign In
</button>
</form>
</div>
<!-- Reset Password Container (Hidden by default) -->
<div class="hidden bg-surface-container-lowest border border-border-subtle rounded-xl shadow-sm p-md flex flex-col transition-all duration-300" id="reset-container">
<div class="pb-md mb-md text-center relative">
<button class="absolute left-0 top-1 text-on-surface-variant hover:text-primary transition-colors flex items-center" onclick="toggleFlow()" type="button">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="font-headline-lg text-headline-lg text-on-background mb-xs">Recover Access</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Provide your identifier to receive a recovery link.</p>
</div>
<form class="flex flex-col gap-sm flex-grow justify-center">
<div class="flex flex-col gap-xs mb-sm">
<label class="font-label-caps text-label-caps uppercase text-on-surface-variant" for="reset-username">Identifier</label>
<input class="bg-surface border border-outline-variant rounded-lg p-sm font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" id="reset-username" placeholder="Student ID or Email" type="text">
</div>
<button class="w-full bg-primary text-on-primary rounded-lg py-sm font-label-caps text-label-caps uppercase hover:bg-primary/90 transition-colors flex justify-center items-center gap-sm" type="button">
                        Send Recovery Link
</button>
</form>
</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full py-md px-margin flex flex-col md:flex-row justify-between items-center gap-md bg-surface border-t border-border-subtle z-10 mt-auto">
<div class="font-headline-md text-sm text-on-surface-variant tracking-tight font-bold">Campus Org System</div>
<div class="flex gap-md font-label-caps text-label-caps">
<a class="text-on-surface-variant hover:text-primary transition-colors uppercase" href="#">Privacy</a>
<a class="text-on-surface-variant hover:text-primary transition-colors uppercase" href="#">Terms</a>
<a class="text-on-surface-variant hover:text-primary transition-colors uppercase" href="#">Support</a>
</div>
<div class="text-on-surface-variant font-label-caps text-label-caps uppercase text-xs">
            ©2024
        </div>
</footer>
<script>
        function toggleFlow() {
            const loginContainer = document.getElementById('login-container');
            const resetContainer = document.getElementById('reset-container');
            
            if (loginContainer.classList.contains('hidden')) {
                resetContainer.classList.add('hidden');
                loginContainer.classList.remove('hidden');
            } else {
                loginContainer.classList.add('hidden');
                resetContainer.classList.remove('hidden');
            }
        }
    </script>
</body></html>
